{% extends 'index_home_store_seller.html' %}
{% load static %}

{% block content %}
<section class="edit-profile-admin"> 
  <div class="edit-profile-admin__wrapper">
    <header class="edit-profile-admin__header">
      <h1 class="edit-profile-admin__title">Editar perfil Vendedor</h1>
      <p class="edit-profile-admin__subtitle">
        Este formulario te permite editar los datos del perfil del Vendedor.
      </p>
    </header>

    <form method="POST" action="{% url 'tiendas:edit_seller_profile' %}" class="edit-profile-admin__form" enctype="multipart/form-data">
      {% csrf_token %}
      
      <!-- FOTO ACTUAL Y SUBIR NUEVA -->
      <div class="edit-store-seller__group">
        <label class="edit-store-seller__label">Foto de Perfil</label>

        <label for="imagen-upload" class="profile-image-label">
          {% if profile.image %}
            <img src="{{ profile.image.url }}" alt="Foto actual" id="profile-preview" class="profile-image">
          {% else %}
            <img src="{% static 'img/admin_profile.png' %}" alt="Foto por defecto" id="profile-preview" class="profile-image">
          {% endif %}
        </label>

        <input type="file" id="imagen-upload" name="imagen" accept="image/*" class="profile-image-input">
      </div>
    
      <!-- Correo -->
      <div class="edit-profile-admin__group">
        <label class="edit-profile-admin__label">Correo electrónico</label>
        <input type="email"
               name="email"
               value="{{ request.user.email }}"
               class="edit-profile-admin__input"
               required />
      </div>

      <!-- Nombre -->
      <div class="edit-profile-admin__group">
        <label class="edit-profile-admin__label">Nombre</label>
        <input type="text"
               name="first_name"
               value="{{ request.user.first_name }}"
               class="edit-profile-admin__input"
               required />
      </div>

      <!-- Teléfono -->
      <div class="edit-store-seller-one__group">
        <label class="edit-store-seller-one__label">Teléfono</label>
        <input type="tel"
               name="telefono"
               value="{{ profile.phone }}"
               class="edit-store-seller-one__input"
               required />
      </div>

      <!-- Botón secundario -->
      <div class="edit-profile-admin__secondary">
        <a href="{% url 'tiendas:profile_store_seller' %}"
           class="btn-secundary btn-secundary-style edit-profile-admin__cancel">
          Cancelar
          <img src="{% static 'assets/icons/cancel.svg' %}" 
               alt=""
               class="btn-secundary__icon"
               aria-hidden="true"/>
        </a>
      </div>

      <!-- Botón principal -->
      <div class="edit-profile-admin__buttons">
        <button type="submit"
                class="btn btn--primary edit-profile-admin__submit"
                aria-label="Guardar datos del vendedor">
          Siguiente
          <img src="{% static 'assets/icons/continue.svg' %}" 
               alt=""
               class="btn__icon edit-profile-admin__icon"
               aria-hidden="true"/>
        </button>
      </div>

    </form>
  </div>
</section>

<!-- JS para previsualizar imagen seleccionada -->
<script>
  const inputImagen = document.getElementById('imagen-upload');
  const preview = document.getElementById('profile-preview');

  inputImagen.addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }
  });
</script>

{% endblock %}

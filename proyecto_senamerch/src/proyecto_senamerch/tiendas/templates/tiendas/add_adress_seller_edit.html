{% extends 'index_home_store_seller.html' %}
{% load static %}
{% block title %}Editar Dirección Vendedor paso 1 | SenaMerch {% endblock %}

{% block content %}
<section class="edit-profile-admin">
  <div class="edit-profile-admin__wrapper">

    <header class="edit-profile-admin__header">
      <h1 class="edit-profile-admin__title">Editar dirección</h1>
      <p class="edit-profile-admin__subtitle">
        Completa la información inicial de tu dirección.
      </p>
    </header>

    <form method="POST" action="{% url 'tiendas:edit_address_seller' %}" class="address-store-form__form">
      {% csrf_token %}

      <div class="address-store-form__group">
        <label class="address-store-form__label">Barrio</label>
        <input 
          type="text"
          name="neighborhood"
          placeholder="Ej: Centro"
          class="address-store-form__input"
          value="{{ request.session.edit_address_data.neighborhood|default:profile.neighborhood }}"
          required
        >
      </div>

      <div class="address-store-form__group">
        <label class="address-store-form__label">Número / Dirección</label>
        <input 
          type="text"
          name="address_number"
          placeholder="Ej: 123A"
          class="address-store-form__input"
          value="{{ request.session.edit_address_data.address_number|default:profile.address_number }}"
          required
        >
      </div>

      <div class="address-store-form__group">
        <label class="address-store-form__label">Tipo de vía</label>
        <input 
          type="text"
          name="road_type"
          placeholder="Ej: Calle, Carrera"
          class="address-store-form__input"
          value="{{ request.session.edit_address_data.road_type|default:profile.road_type }}"
          required
        >
      </div>

      <div class="address-store-form__group">
        <label class="address-store-form__label">Código postal</label>
        <input 
          type="text"
          name="postal_code"
          placeholder="Ej: 660001"
          class="address-store-form__input"
          value="{{ request.session.edit_address_data.postal_code|default:profile.postal_code }}"
          required
        >
      </div>

      <div class="address-store-form__secondary">
        <a href="{% url 'tiendas:edit_seller_profile2' %}" 
           class="btn-secundary btn-secundary-style">
          Volver
          <img src="{% static 'assets/icons/return.svg' %}" 
               class="btn-secundary__icon">
        </a>
      </div>

      <div class="address-store-form__buttons">
        <button type="submit" class="btn btn--primary">
          Siguiente
          <img src="{% static 'assets/icons/continue.svg' %}" 
               class="btn__icon">
        </button>
      </div>

    </form>
  </div>
</section>
{% endblock %}

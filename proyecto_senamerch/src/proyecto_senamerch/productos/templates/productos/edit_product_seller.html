{% extends "index_create_product.html" %}
{% load static %}

{% block content %}
<section class="edit-product-one">
  <div class="edit-product-one__wrapper">
    
    <header class="edit-product-one__header">
      <h1 class="edit-product-one__title">Editar producto</h1>
      <p class="edit-product-one__subtitle">
        Este formulario es para editar<br> tu producto en <strong>SENA MERCH</strong>.
        Podrás actualizar su información y gestionarlo fácilmente.
      </p>
    </header>

    <form method="POST" action="{% url 'productos:edit_product_seller' producto.id %}" class="edit-product-one__form">
      {% csrf_token %}

      <div class="edit-product-one__group">
        <label class="edit-product-one__label">Edita el nombre del producto</label>
        <input 
          type="text"
          name="name"
          value="{{ producto.nombre }}"
          class="edit-product-one__input"
          required
        >
      </div>

      <div class="edit-product-one__group">
        <label class="edit-product-one__label">Edita el precio</label>
        <input 
          type="number"
          name="price"
          value="{{ producto.precio }}"
          class="edit-product-one__input"
          min="0"
          required
        >
      </div>
      
      <div class="edit-product-one__group">
        <label class="edit-product-one__label">Edita la categoría</label>
        <select name="categoria" class="edit-product-one__input" required>
          {% for value, label in producto.CATEGORIA_CHOICES %}
            <option value="{{ value }}" {% if producto.categoria == value %}selected{% endif %}>
              {{ label }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="edit-product-one__group">
        <label class="edit-product-one__label">Edita el Precio * Unidad de medida</label>
        <select name="unit" class="edit-product-one__input" required>
          {% for value, label in producto.UNIDAD_MEDIDA_CHOICES %}
            <option value="{{ value }}" {% if producto.unidad_medida == value %}selected{% endif %}>
              {{ label }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="edit-product-one__secondary">
        <a href="{% url 'tiendas:seller_catalog' %}"
           class="btn-secundary btn-secundary-style edit-product-one__cancel">
          Cancelar
          <img src="{% static 'assets/icons/cancel.svg' %}" 
               alt=""
               class="btn-secundary__icon"
               aria-hidden="true"/>
        </a>
      </div>

      <div class="edit-product-one__buttons">
        <button type="submit" class="btn btn--primary edit-product-one__continue">
          Siguiente
          <img src="{% static 'assets/icons/continue.svg' %}" 
               alt=""
               class="btn-secundary__icon"
               aria-hidden="true"/>
        </button>
      </div>

    </form>
  </div>
</section>
{% endblock %}

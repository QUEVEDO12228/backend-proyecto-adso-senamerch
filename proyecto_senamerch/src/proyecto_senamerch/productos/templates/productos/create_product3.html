{% extends "index_create_product.html" %}
{% block content %}

<section class="create-post">
  <div class="create-post__wrapper">

    <header class="create-post__header">
      <h1 class="create-post__title">Agrega las características del producto</h1>
      <p class="create-post__subtitle">
        Este formulario es para registrar tu producto.
      </p>
    </header>

    <form method="POST" action="{% url 'productos:create_product_step3' %}" class="create-post__form">
      {% csrf_token %}

      <!-- Descripción -->
      <div class="create-post__group">
        <label class="create-post__label">Descripción producto</label>
        <textarea 
          name="description"
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
          required
        ></textarea>
      </div>

      <!-- Tipo envío -->
      <div class="create-post__group">
        <label class="create-post__label">Tipo de envío</label>
        <select name="shipping_type" class="create-post__input" required>
          <option value="" selected disabled>Selecciona una opción</option>
          <option value="contraentrega">Sí, solo envío contraentrega</option>
        </select>
      </div>

      <div class="create-post__secondary">
        <a href="{% url 'productos:create_product_step3' %}" class="btn-secundary btn-secundary-style">
          Volver
          <img src="{% static 'assets/icons/return.svg' %}" 
               alt=""
               class="btn-secundary__icon"
               aria-hidden="true"/>
        </a>
      </div>


      <div class="create-post__buttons">
        <button type="submit" class="btn btn--primary">
          Siguiente
          <img src="{% static 'assets/icons/continue.svg' %}" 
               alt=""
               class="btn-secundary__icon"
               aria-hidden="true"/>
        </button>
      </div>

    </form>

  </div>
</section>

{% endblock %}

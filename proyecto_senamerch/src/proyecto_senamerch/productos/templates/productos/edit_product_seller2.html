{% extends "index_create_product.html" %}
{% load static %}

{% block content %}
<section class="edit-post-two">
  <div class="edit-post-two__wrapper">

    <header class="edit-post-two__header">
      <h1 class="edit-post-two__title">Edita la información del producto</h1>
    </header>

    <form method="POST" action="{% url 'productos:edit_product_step2' producto.id %}" class="edit-post-two__form">
      {% csrf_token %}

      <div class="edit-post-two__group">
        <label class="edit-post-two__label">Edita el Tipo de producto</label>
        <select name="tipo_producto" class="edit-post-two__input" required>
          {% for value, label in producto.TIPO_PRODUCTO_CHOICES %}
            <option value="{{ value }}" {% if producto.tipo_producto == value %}selected{% endif %}>
              {{ label }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="edit-post-two__group">
        <label class="edit-post-two__label">Edita el Descuento (%)</label>
        <input 
          type="number"
          name="discount"
          value="{{ producto.descuento }}"
          class="edit-post-two__input"
          min="0"
          max="100"
        >
      </div>

      <div class="edit-post-two__group">
        <label class="edit-post-two__label">Edita la Fecha de caducidad</label>
        <input 
          type="date"
          name="expiration_date"
          value="{{ producto.fecha_caducidad|date:'Y-m-d' }}"
          class="edit-post-two__input"
          required
        >
      </div>

      <div class="edit-post-two__group">
        <label class="edit-post-two__label">Edita el Metodo de pago</label>
        <select name="payment_method" class="edit-post-two__input" required>
          {% for value, label in producto.METODO_PAGO_CHOICES %}
            <option value="{{ value }}" {% if producto.metodo_pago == value %}selected{% endif %}>
              {{ label }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="edit-post-two__group">
        <div class="edit-post-two__secondary">
          <a href="{% url 'productos:edit_product_seller' producto.id %}"
             class="btn-secundary btn-secundary-style edit-post-two__cancel">
            Volver
          </a>
        </div>
      </div>

      <div class="edit-post-two__group">
        <div class="edit-post-two__buttons">
          <button type="submit" class="btn btn--primary edit-post-two__save">
            Siguiente
          </button>
        </div>
      </div>

    </form>
  </div>
</section>
{% endblock %}

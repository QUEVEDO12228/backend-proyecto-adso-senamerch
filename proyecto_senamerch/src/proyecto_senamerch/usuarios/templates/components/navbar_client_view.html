{% load static %}

<nav class="navbar_product_category">

  <div class="navbar_left_group">
      <div class="navbar_product_category__actions--left">
          <a href="{% url 'usuarios:home' %}" class="navbar_product_category__link-image">
            <img src="{% static 'assets/img/sena-logo.png' %}" class="navbar_product_category__img" alt="">
          </a>
      </div>  

      <!-- Línea negra -->
      <div class="navbar_separator"></div>

      <div class="navbar_product_category__logo--left">
        <h1 class="navbar_product_category__title--SenaMerch">
          <span class="navbar_product_category__letter navbar_product_category__letter--1">S</span>
          <span class="navbar_product_category__letter navbar_product_category__letter--2">e</span>
          <span class="navbar_product_category__letter navbar_product_category__letter--3">n</span>
          <span class="navbar_product_category__letter navbar_product_category__letter--4">a</span>
          <span class="navbar_product_category__letter navbar_product_category__letter--5">M</span>
          <span class="navbar_product_category__letter navbar_product_category__letter--6">e</span>
          <span class="navbar_product_category__letter navbar_product_category__letter--7">r</span>
          <span class="navbar_product_category__letter navbar_product_category__letter--8">c</span>
          <span class="navbar_product_category__letter navbar_product_category__letter--9">h</span>
          <img src="{% static 'assets/icons/wheat.svg' %}" alt="" class="navbar_product_category__icon">
        </h1>
      </div>
  </div>

  <div class="navbar_product_category__actions">

    <!-- PEDIDOS -->
    <a href="{% url 'pedidos:client_orders' %}" 
       class="navbar_product_category__link navbar_product_category__link--icon-nav-bar">
      <img src="{% static 'assets/icons/orders.svg' %}" 
           class="navbar_product_category__icon" 
           alt="">
      <span class="navbar_product_category__tooltip">Pedidos</span>
    </a>

    <!-- CREAR TIENDA (solo si no tiene) -->
    {% if request.user.is_authenticated and request.user.tiendas.count == 0 %}
    <a href="{% url 'tiendas:create_store' %}" 
       class="navbar_product_category__link navbar_product_category__link--icon-nav-bar">
      <img src="{% static 'assets/icons/create_store.svg' %}" 
           class="navbar_product_category__icon" 
           alt="">
      <span class="navbar_product_category__tooltip">Crear tienda</span>
    </a>
    {% endif %}

    <!-- PERFIL -->
    <a href="{% url 'usuarios:profile' %}" 
       class="navbar_product_category__link navbar_product_category__link--icon-nav-bar">
      <img src="{% static 'assets/icons/profile_user.svg' %}" 
           class="navbar_product_category__icon" 
           alt="">
      <span class="navbar_product_category__tooltip">Perfil</span>
    </a>
    <!-- LOGOUT -->
    <a href="{% url 'usuarios:logout' %}" 
       class="navbar_product_category__link navbar_product_category__link--icon-nav-bar">
      <img src="{% static 'assets/icons/exit.svg' %}" 
           class="navbar_product_category__icon" 
           alt="">
      <span class="navbar_product_category__tooltip">Salir</span>
    </a>

    

  </div>

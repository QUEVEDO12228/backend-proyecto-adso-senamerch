{% extends "index_edit_profile_client.html" %}
{% load static %}

{% block content %}
<section class="edit-profile-user">
  <div class="edit-profile-user__wrapper">

    <!-- Header -->
    <header class="edit-profile-user__header">
      <h1 class="edit-profile-user__title">Editar perfil</h1>
      <p class="edit-profile-user__subtitle">
        Actualiza tu información personal y mantén tu cuenta al día.
      </p>
    </header>

    <!-- Form -->
    <form class="edit-profile-user__form"
      method="POST"
      action="{% url 'usuarios:edit_profile_client' %}"
      enctype="multipart/form-data">
      {% csrf_token %}

      <!-- FOTO DE PERFIL CON PREVIEW -->
      <div class="edit-store-seller__group">
        <label class="edit-store-seller__label">Foto de Perfil</label>

        <label for="imagen-upload" class="profile-image-label">

          {% if profile.image %}
            <img src="{{ profile.image.url }}"
                 alt="Foto actual"
                 id="profile-preview"
                 class="profile-image">
          {% else %}
            <img src="{% static 'img/admin_profile.png' %}"
                 alt="Foto por defecto"
                 id="profile-preview"
                 class="profile-image">
          {% endif %}

        </label>

        <input type="file"
               id="imagen-upload"
               name="cover_image"
               accept="image/*"
               class="profile-image-input">
      </div>

      <!-- Dirección -->
      <div class="edit-profile-user__group">
        <label class="edit-profile-user__label">Dirección</label>
        <a href="{% url 'usuarios:edit_address_profile_user' %}" class="edit-profile-user__link">
          Editar dirección
        </a>
        <span class="edit-profile-user__label">
          Si tuviste un error puedes corregir tu dirección
        </span>
      </div>

      <!-- Correo -->
      <div class="edit-profile-user__group">
        <label class="edit-profile-user__label">Correo electrónico</label>
        <input type="email"
               name="email"
               class="edit-profile-user__input"
               value="{{ request.user.email }}">
      </div>

      <!-- Nombre -->
      <div class="edit-profile-user__group">
        <label class="edit-profile-user__label">Nombre</label>
        <input type="text"
               name="name"
               class="edit-profile-user__input"
               value="{{ request.user.first_name }}">
      </div>

      <!-- Botón Volver -->
      <div class="edit-profile-user__secondary">
        <a href="{% url 'usuarios:profile' %}"
           class="btn-secundary btn-secundary-style edit-profile-user__cancel">
          Volver
          <img src="{% static 'assets/icons/return.svg' %}"
               alt=""
               class="btn-secundary__icon"
               aria-hidden="true">
        </a>
      </div>

      <!-- Botón Guardar -->
      <div class="edit-profile-user__buttons">
        <button type="submit"
                class="btn btn--primary edit-profile-user__submit">
          Siguiente
          <img src="{% static 'assets/icons/continue.svg' %}"
               alt=""
               class="btn__icon edit-profile-user__icon">
        </button>
      </div>

    </form>
  </div>
</section>

<!-- SCRIPT PREVIEW AUTOMÁTICO -->
<script>
document.getElementById("imagen-upload").addEventListener("change", function(event) {
    const reader = new FileReader();
    reader.onload = function(){
        document.getElementById("profile-preview").src = reader.result;
    };
    reader.readAsDataURL(event.target.files[0]);
});
</script>

{% endblock %}

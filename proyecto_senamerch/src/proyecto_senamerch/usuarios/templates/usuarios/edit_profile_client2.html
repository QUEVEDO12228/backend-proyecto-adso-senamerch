{% extends "index_edit_profile_client.html" %}
{% load static %}

{% block content %}
<section class="edit-profile-user">
  <div class="edit-profile-user__wrapper">

    <!-- Header -->
    <header class="edit-profile-user__header">
      <h1 class="edit-profile-user__title">Editar perfil</h1>
      <p class="edit-profile-user__subtitle">
        Actualiza tu información personal y mantén tu cuenta al día.
      </p>
    </header>

    <!-- 🔥 MENSAJES -->
    {% if messages %}
      <div class="edit-profile-user__group">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <!-- Form -->
    <form 
      class="edit-profile-user__form" 
      method="POST"
      action="{% url 'usuarios:edit_profile_client2' %}">
      
      {% csrf_token %}

      <!-- Tipo de usuario -->
      <div class="edit-profile-user__group">
        <label class="edit-profile-user__label">Tipo de usuario</label>
        <input
          type="text"
          class="edit-profile-user__input edit-profile-user__input--readonly"
          value="Cliente"
          readonly>
      </div>

      <!-- Teléfono -->
      <div class="edit-profile-user__group">
        <label class="edit-profile-user__label">Teléfono</label>
        <input
          type="tel"
          name="phone"
          class="edit-profile-user__input"
          value="{{ user.profile.phone|default:'' }}"
          required>
      </div>

      <!-- Contraseña -->
      <!-- Columna: Contraseña actual -->
      <div class="edit-profile-user__group password-col">
        <label class="edit-profile-user__label">Escribe tu contraseña actual</label>
        <div class="edit-profile-user__password-wrapper">
          <input
            name="password"
            type="password"
            class="edit-profile-user__input edit-profile-user__input--password"
            required>
          <button type="button" class="edit-profile-user__toggle-password">
            Mostrar
          </button>
        </div>
      </div>

      <!-- Columna: Confirmar contraseña -->
      <div class="edit-profile-user__group confirmar-col">
        <label class="edit-profile-user__label">Confirma tu contraseña</label>
        <div class="edit-profile-user__password-wrapper">
          <input
            name="password_confirm"
            type="password"
            class="edit-profile-user__input edit-profile-user__input--password"
            required>
          <button type="button" class="edit-profile-user__toggle-password">
            Mostrar
          </button>
        </div>
      </div>

      <!-- Botón secundario -->
      <div class="edit-profile-user__secondary">
        <a href="{% url 'usuarios:edit_profile_client' %}"
           class="btn-secundary btn-secundary-style edit-profile-user__cancel">
          Volver
          <img
            src="{% static 'assets/icons/return.svg' %}"
            alt=""
            class="btn-secundary__icon"
            aria-hidden="true">
        </a>
      </div>

      <!-- Botón principal -->
      <div class="edit-profile-user__buttons">
        <button
          type="submit"
          class="btn btn--primary edit-profile-user__submit">
          Guardar cambios
          <img
            src="{% static 'assets/icons/save.svg' %}"
            alt=""
            class="btn__icon edit-profile-user__icon">
        </button>
      </div>

    </form>
  </div>
</section>
<script>
  document.querySelectorAll(".edit-profile-user__toggle-password")
    .forEach(button => {
      button.addEventListener("click", function () {
        const input = this.previousElementSibling;

        if (input.type === "password") {
          input.type = "text";
          this.textContent = "Ocultar";
        } else {
          input.type = "password";
          this.textContent = "Mostrar";
        }
      });
    });
</script>
{% endblock %}

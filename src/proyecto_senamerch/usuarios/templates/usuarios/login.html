{% extends 'index_login.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<section class="site-main-login">
  <div class="login">

    <h1 class="login__title">Iniciar Sesión</h1>

    <!-- 🔔 MENSAJES DE ERROR -->
    {% if form_submitted and messages %}
      <div class="login__messages">
        {% for message in messages %}
          <p class="login__error">
            {{ message }}
          </p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post" class="login__form">
      {% csrf_token %}

      <div class="login__field">
        <label class="login__label" for="email">Correo electrónico</label>
        <input
          id="email"
          class="login__input login__input--email"
          type="email"
          name="email"
          placeholder="Correo electrónico"
          required
        >
      </div>

      <div class="login__field">
        <label class="login__label" for="password">Contraseña</label>

        <div class="login__password-wrapper">
          <input
            id="password"
            class="login__input login__input--password"
            type="password"
            name="password"
            placeholder="Contraseña"
            required
          >
          <button type="button" class="login__toggle-password">
            Mostrar
          </button>
        </div>
      </div>

      <div class="login__actions">
        <button type="submit" class="btn btn--primary login__btn">
          Ingresar
        </button>
      </div>

      <div class="login__content-links">
        <a href="#" class="login__link">¿Olvidaste tu contraseña?</a>
        <a href="#" class="login__link">¿Registrarte?</a>
      </div>

    </form>
  </div>
</section>
{% endblock %}
